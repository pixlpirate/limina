<button
	class="icon-button icon-button--light icon-button--small"
	type="button"
	(pointerdown)="press(1, $event)"
	(pointerup)="release()"
	(pointercancel)="release()"
	(keydown)="onKeyDown(1, $event)"
	(keyup)="release()"
>
	<i class="icon-angle-up" aria-hidden="true"></i>
	<span class="visually-hidden">{{ 'landscape.raise' | translate }}</span>
</button>

<button
	class="icon-button icon-button--light icon-button--small"
	type="button"
	(pointerdown)="press(-1, $event)"
	(pointerup)="release()"
	(pointercancel)="release()"
	(keydown)="onKeyDown(-1, $event)"
	(keyup)="release()"
>
	<i class="icon-angle-down" aria-hidden="true"></i>
	<span class="visually-hidden">{{ 'landscape.lower' | translate }}</span>
</button>
